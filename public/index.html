    <meta name="description" content="GBot Ultra — Panel de administración para grupos de Telegram" />

  <body>
    <div id="splash" class="splash">
      <div class="splash-logo">GB</div>
      <div class="splash-title">GBot Ultra</div>
      <div class="splash-sub">Administración inteligente para tu grupo</div>
      <div class="spinner" aria-label="Cargando"></div>
    </div>

    <div id="app" class="app-shell" hidden>
      <header class="topbar">
        <div class="topbar-inner">
          <button class="brand" data-action="refresh" aria-label="Actualizar panel">
            <span class="brand-logo">GB</span>
            <span class="brand-text">
              <span class="brand-name">GBot Ultra</span>
              <span class="brand-tag">Panel de control</span>
            </span>
          </button>

          <div class="topbar-center">
            <button class="chat-switcher" id="chat-switcher" data-action="chats" aria-label="Cambiar grupo">
              <span class="chat-switcher-avatar" id="chat-switcher-avatar">GB</span>
              <span class="chat-switcher-text">
                <span class="chat-switcher-title" id="chat-switcher-title">Cargando…</span>
                <span class="chat-switcher-meta" id="chat-switcher-meta">—</span>
              </span>
              <svg class="icon icon-sm"><use href="#i-chevron-down"></use></svg>
            </button>
          </div>

          <div class="topbar-actions">
            <span class="demo-pill" id="demo-pill" hidden>DEMO</span>
            <button class="icon-btn" id="theme-toggle" data-action="toggle-theme" aria-label="Cambiar tema">
              <svg class="icon"><use href="#i-moon"></use></svg>
            </button>
            <button class="icon-btn" data-action="refresh" aria-label="Actualizar">
              <svg class="icon"><use href="#i-refresh"></use></svg>
            </button>
            <button class="user-avatar" id="user-avatar" data-action="profile" aria-label="Tu perfil">A</button>
          </div>
        </div>
      </header>

      <main id="main" class="main" tabindex="-1"></main>

      <nav class="bottom-nav notranslate" id="bottom-nav" aria-label="Navegación principal" translate="no">
        <button class="nav-item active" data-tab="home">
          <svg class="icon"><use href="#i-home"></use></svg>
          <span>Inicio</span>
        </button>
        <button class="nav-item" data-tab="members">
          <svg class="icon"><use href="#i-users"></use></svg>
          <span>Miembros</span>
        </button>
        <button class="nav-item" data-tab="moderation">
          <svg class="icon"><use href="#i-shield"></use></svg>
          <span>Moderación</span>
        </button>
        <button class="nav-item" data-tab="settings">
          <svg class="icon"><use href="#i-sliders"></use></svg>
          <span>Ajustes</span>
        </button>
        <button class="nav-item" data-tab="premium">
          <svg class="icon"><use href="#i-crown"></use></svg>
          <span>Premium</span>
          <span class="nav-dot" id="premium-dot" hidden></span>
        </button>
      </nav>
    </div>

    <div id="modal-root"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
